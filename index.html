<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Week Town</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=16">
  <link rel="stylesheet" href="admin.css?v=16">
</head>
<body>
  <header class="top">
    <span class="brand"><img src="icons/home.png" alt="">My Week Town</span>
    <span class="right">
      <span class="pill" id="status">Today</span>
      <button class="pill btnpill iconbtn" id="homebtn" title="Home" aria-label="Home"><img src="icons/home.png" alt=""></button>
      <span id="rolebox"></span>
    </span>
  </header>

  <div class="world"><div class="map" id="map"></div></div>

  <section class="sheet" id="sheet" aria-live="polite"></section>
  <section class="finale" id="finale" hidden></section>
  <section class="adminview" id="adminview" hidden></section>

  <!-- Icons: Fluent Emoji 3D by Microsoft, MIT (icons-LICENSE.txt). Cat: oneko by adryd, MIT (oneko-LICENSE.txt) -->
  <script src="data.js?v=16"></script>
  <script src="store.js?v=16"></script>
  <script src="app.js?v=16"></script>
  <script src="admin.js?v=16"></script>
  <script type="module" src="ai.js?v=16"></script>
</body>
</html>
