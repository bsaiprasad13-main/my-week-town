<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekly Why Cards</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="go-home" type="button">🃏 Weekly Why Cards</button>
    <button type="button" class="pill" id="go-progress">Progress</button>
  </header>
  <div class="weekbar"><span id="week-label"></span></div>

  <main id="screen" aria-live="polite"></main>

  <footer class="demo">
    <span>Prototype · sample data for 4 weeks in 2040</span>
    <span class="row">
      <button type="button" id="next-week" class="link">Skip to next week ▸</button>
      <button type="button" id="go-settings" class="link">Settings</button>
      <button type="button" id="reset-demo" class="link">Reset demo</button>
    </span>
  </footer>

  <script src="js/data/reasons.js"></script>
  <script src="js/data/sample-weeks.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/cardBuilder.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/metrics.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
